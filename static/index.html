<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveRecorder Studio</title>
<link rel="icon" type="image/x-icon" href="/icon.ico">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <img class="mark" src="/icon.png" alt="LiveRecorder Studio">
      <div><div class="brand-name">LiveRecorder <b>Studio</b></div><div class="brand-sub">多平台直播值守录制</div></div>
    </div>
    <div class="topbar-right">
      <button id="btnFolder" class="btn ghost" title="打开全部主播的录制文件夹">
        <svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v9a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7z"/></svg>目录</button>
      <button id="btnSettings" class="btn ghost" title="设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>设置</button>
      <button id="btnSide" class="btn ghost icon-only tip-wrap tip-below" data-tip="收起侧栏">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M15 4v16"/><path d="M11.5 12h-5"/><path d="M8.5 9.5 6 12l2.5 2.5"/></svg></button>
      <button id="btnEngine" class="btn primary"><span class="dot"></span><span id="btnEngineText">启动监测</span></button>
    </div>
  </header>

  <main class="grid" id="layout">
    <section class="panel rooms-panel">
      <div class="panel-head">
        <div><h2>直播间</h2><p id="roomsHint">导入链接后启动监测</p></div>
        <div class="panel-actions">
          <input id="search" class="input search" placeholder="搜索主播、备注或链接" autocomplete="off">
          <button id="btnImport" class="btn small icon-only add-btn tip-wrap tip-below" data-tip="导入直播间" title="导入直播间">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </div>      <div class="table-wrap">
        <table>
          <thead><tr>
            <th style="width:10%">状态</th><th style="width:7%">平台</th><th style="width:33%">主播名</th>
            <th class="q-col" style="width:11%">画质</th><th class="q-col" style="width:13%">已录制时长</th><th style="width:26%">操作</th>
          </tr></thead>
          <tbody id="roomRows"></tbody>
        </table>
        <div id="empty" class="empty">
          <div class="empty-ring"><span></span></div>
          <h3>还没有直播间</h3>
          <p>点右上角「+」导入直播间，支持批量粘贴；也可用 <code>demo://演示</code> 离线体验录制流程。</p>
        </div>
      </div>
    </section>

    <aside class="side">
      <div class="stats">
        <div class="stat"><span>房间总数</span><b id="sTotal">0</b></div>
        <div class="stat"><span>正在直播</span><b id="sLive" class="teal">0</b></div>
        <div class="stat"><span>录制中</span><b id="sRec" class="red">0</b></div>
        <div class="stat"><span>异常</span><b id="sErr" class="amber">0</b></div>
      </div>
      <section class="panel log-panel">
        <div class="panel-head"><div><h2>运行日志</h2><p>实时 · 最近 120 条</p></div><button id="btnClearLog" class="btn tiny ghost">清屏</button></div>
        <div id="logs" class="logs"></div>
      </section>
    </aside>
  </main>

  <footer class="statusbar">
    <span id="footEngine">引擎未启动</span><span class="sep"></span>
    <span id="footConfig">间隔 180s · 并发 8</span><span class="sep"></span>
    <span id="footFfmpeg">ffmpeg 检测中</span>
    <span id="footHotkey" class="muted"></span>
    <span class="grow"></span><span class="muted">本地运行 · 数据不出本机 · 右上角图标退出</span>
  </footer>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h3 id="modalTitle">批量导入</h3><button id="modalClose" class="icon-btn" data-close="1">×</button></div>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalFoot" class="modal-foot"><button class="btn ghost" data-close="1">取消</button><button id="modalOk" class="btn primary">确认</button></div>
  </div>
</div>
<div id="drawer" class="drawer hidden">
  <div class="drawer-mask" data-close="1"></div>
  <aside class="drawer-panel">
    <header class="drawer-head">
      <div><h3 id="drawerTitle">主播详情</h3><p id="drawerSub"></p></div>
      <button class="icon-btn" data-close="1" title="关闭">×</button>
    </header>
    <div id="drawerBody" class="drawer-body"></div>
    <footer id="drawerFoot" class="drawer-foot"></footer>
  </aside>
</div>

<div id="toast" class="toast"></div>
<script src="/app.js"></script>
</body>
</html>
